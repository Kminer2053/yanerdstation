<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>인증샷 구도 · 실제 서울역 3D</title><style>body{margin:0;background:#e9ede5;color:#254c41;font:14px system-ui}header{padding:20px}button{padding:12px;margin-right:8px;cursor:pointer}#world{width:300px;height:200px;position:absolute;right:10px;top:10px;z-index:-1}#photo{display:block;max-width:95vw;max-height:80vh;object-fit:contain;margin:auto;border:10px solid #fff}#state{padding:10px 20px}</style><header><h1>서울역 인증샷 구도 검증</h1><button id="han" disabled>한정선 정면</button><button id="stairs" disabled>대계단 아래에서 위로</button><button id="capture" disabled>다시 촬영</button></header><div id="world"></div><p id="state">원본 기반 공간 로딩 중…</p><img id="photo" alt="실제 3D 인증샷"><script type="module">
import {createCommonsWorld} from '/src/commons-world.js';import{makeIndexes}from'/src/commons-core.js';import{gamePlaces}from'/src/commons-game-core.js';const $=id=>document.getElementById(id);const[hall,architecture,custom]=await Promise.all(['/data/commons/hall.json','/data/commons/architecture.json','/data/commons/custom.json'].map(url=>fetch(url).then(r=>r.json()))),indexes=makeIndexes(hall,architecture,custom),places=gamePlaces(hall,custom,indexes);const world=await createCommonsWorld({host:$('world'),hall,architecture,custom,indexes,onError:text=>$('state').textContent=text});let place=places.find(p=>p.id==='photo-hanjeongseon'),person,disposed=false;function capture(){const frame=world.captureFrame({self:person,people:[person],time:4,pose:'wave',lookAt:place.lookAt,photoView:place.photoView});$('photo').src=frame.toDataURL('image/png');$('state').textContent=place.name+' · '+JSON.stringify(place.photoView)+' · '+frame.width+'×'+frame.height;}function select(id){place=places.find(p=>p.id===id);person={id:'self',self:true,character:'adult-woman',heldItem:'rail-block',floor:place.floor,x:place.point[0],y:place.point[1],z:place.point[2],yaw:0,pitch:0};world.setFloor(place.floor);world.setOverview(false);world.tick({self:person,people:[person],time:4,dt:1,active:true});capture();}for(const[id,placeId]of[['han','photo-hanjeongseon'],['stairs','photo-stairs']]){$(id).disabled=false;$(id).onclick=()=>select(placeId);}$('capture').disabled=false;$('capture').onclick=capture;select(place.id);function animate(t){if(disposed)return;world.tick({self:person,people:[person],time:t/1000,dt:1/60,active:false});requestAnimationFrame(animate);}requestAnimationFrame(animate);window.addEventListener('pagehide',()=>{disposed=true;world.dispose();},{once:true});
</script></html>
