<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>캐릭터 3D 시각 검증</title><style>html,body{margin:0;height:100%;background:#e9e4da;font:14px system-ui;color:#253c38}#stage{position:absolute;inset:0}header{position:absolute;z-index:1;top:20px;left:24px}h1{font-size:22px;margin:0 0 5px}p{margin:5px 0}nav{display:flex;gap:6px;margin-top:10px}button{border:1px solid #a8b5aa;border-radius:12px;background:#fff;padding:9px 15px;color:inherit;cursor:pointer}footer{position:absolute;bottom:15px;left:24px;font-size:12px}canvas{display:block;width:100%;height:100%}</style><div id="stage"></div><header><h1>서울역 여행자 여섯 명</h1><p>어린이 2 · 성인 2 · 어르신 2 · 상시 역무원 2</p><nav><button id="group">모두 보기</button><button id="rail">철도블럭</button><button id="food">구운란사이</button><button id="wave">손인사</button><button id="photo">3D 사진</button></nav></header><footer id="stats"></footer><script type="module">
import * as T from 'three';import {createAvatarBatch} from '/src/commons-avatars.js';import {AVATAR_IDS} from '/src/commons-avatar-styles.js';import {captureCommonsFrame} from '/src/commons-photo.js';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.setSize(innerWidth,innerHeight);document.querySelector('#stage').append(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#e9e4da');const camera=new T.PerspectiveCamera(38,innerWidth/innerHeight,.07,100);camera.position.set(0,3.2,-10.5);camera.lookAt(0,1,0);scene.add(new T.HemisphereLight('#fff8ec','#8faaa0',2.8));const sun=new T.DirectionalLight('#fff0d7',2.6);sun.position.set(-4,9,-5);scene.add(sun);const floor=new T.Mesh(new T.PlaneGeometry(200,200),new T.MeshStandardMaterial({color:'#deded0',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.01;scene.add(floor);const batch=createAvatarBatch(scene);await batch.setProductTexture('/assets/commons/guunran-sai-package.png','/assets/commons/guunran-sai-can.png');let solo=false,pose='idle',held='';const people=AVATAR_IDS.map((character,i)=>({id:'p'+i,self:i===3,x:(i-2.5)*1.3,y:0,z:0,yaw:0,color:i,character,floor:'2F'}));people.push({id:'staff1',npc:true,npcRole:'staff',character:'adult-man',x:-.7,y:0,z:2,yaw:0},{id:'staff2',npc:true,npcRole:'staff',character:'adult-woman',x:.7,y:0,z:2,yaw:0});
document.querySelector('#group').onclick=()=>{solo=false;held='';pose='idle';camera.position.set(0,3.2,-10.5);camera.lookAt(0,1,0);};for(const[id,item]of [['rail','rail-block'],['food','storyway-set']])document.getElementById(id).onclick=()=>{solo=true;held=item;camera.position.set(.7,1.8,-3.5);camera.lookAt(0,1,0);};document.querySelector('#wave').onclick=()=>pose=pose==='wave'?'cheer':'wave';document.querySelector('#photo').onclick=()=>{const self={...people[3],x:0,heldItem:held,pose};const canvas=captureCommonsFrame({renderer,scene,camera,actors:batch,self,people:[self],pose:'cheer'});const link=document.createElement('a');link.href=canvas.toDataURL('image/png');link.download='avatar-3d.png';link.click();};
function frame(now){batch.update(solo?[{...people[3],x:0,heldItem:held,pose}]:people.map((p,i)=>({...p,pose,moving:i===2})),now/1000);renderer.render(scene,camera);document.querySelector('#stats').textContent=renderer.info.render.calls+' draw calls · '+renderer.info.render.triangles.toLocaleString()+' triangles';requestAnimationFrame(frame);}requestAnimationFrame(frame);addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
</script></html>
